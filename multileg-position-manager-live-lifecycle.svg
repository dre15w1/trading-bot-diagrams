<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Live multi-leg parent and child position lifecycle</title>
  <desc id="desc">A selected package passes approval and capability gates, becomes a parent and child group, is submitted atomically, reconciled from actual fills, monitored, and closed atomically. Partial or mismatched positions are quarantined.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#1b2842"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".3"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#76d5ff"/></marker>
    <style>.ttl{font:700 33px system-ui;fill:#f6fbff}.sub{font:400 16px system-ui;fill:#bad0df}.box{rx:17;stroke-width:1.7;filter:url(#s)}.normal{fill:#203952;stroke:#628daf}.live{fill:#194138;stroke:#5ec6a2}.wait{fill:#4b3c24;stroke:#e1aa4f}.bad{fill:#512c34;stroke:#ed7785}.done{fill:#273d59;stroke:#829cc1}.h{font:700 18px system-ui;fill:#f8fbff}.cap{font:700 12px system-ui;letter-spacing:.9px;fill:#9fc0d3}.t{font:400 13px system-ui;fill:#ccdee9}.flow{fill:none;stroke:#76d5ff;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#ed7785;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#a)}.lane{fill:none;stroke:#46647a;stroke-width:1.5;stroke-dasharray:5 7}.label{font:700 13px system-ui;fill:#8eb8cf}</style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="55" y="58" class="ttl">Live Multi-Leg Position Lifecycle — Parent and Copier Children</text>
  <text x="55" y="87" class="sub">Every state transition is group-based, persistent, idempotent and reconciled against actual broker facts.</text>
  <path d="M45 175H1555M45 525H1555" class="lane"/><text x="55" y="155" class="label">DECISION + ENTRY</text><text x="55" y="505" class="label">MONITORING + EXIT</text>

  <rect x="55" y="215" width="230" height="170" class="box normal"/><text x="80" y="250" class="cap">POSITION MANAGER</text><text x="80" y="286" class="h">SELECTED</text><text x="80" y="320" class="t">Exact structure and OCC legs</text><text x="80" y="347" class="t">Quantity • limit • max loss</text>
  <rect x="335" y="215" width="230" height="170" class="box wait"/><text x="360" y="250" class="cap">LIVE PROMOTION</text><text x="360" y="286" class="h">APPROVED</text><text x="360" y="320" class="t">Operator + qualification</text><text x="360" y="347" class="t">Capability + expiring approval</text>
  <rect x="615" y="215" width="230" height="170" class="box live"/><text x="640" y="250" class="cap">DURABLE LEDGER</text><text x="640" y="286" class="h">SUBMITTING</text><text x="640" y="320" class="t">Parent/child group persisted</text><text x="640" y="347" class="t">Event idempotency reserved</text>
  <rect x="895" y="215" width="230" height="170" class="box live"/><text x="920" y="250" class="cap">BROKER COMPLEX ORDER</text><text x="920" y="286" class="h">WORKING</text><text x="920" y="320" class="t">One native atomic order</text><text x="920" y="347" class="t">All exact legs together</text>
  <rect x="1175" y="215" width="230" height="170" class="box live"/><text x="1200" y="250" class="cap">RECONCILIATION</text><text x="1200" y="286" class="h">OPEN</text><text x="1200" y="320" class="t">Actual fill and remaining qty</text><text x="1200" y="347" class="t">Broker IDs and net fill</text>

  <path d="M285 300H335" class="flow"/><path d="M565 300H615" class="flow"/><path d="M845 300H895" class="flow"/><path d="M1125 300H1175" class="flow"/>

  <rect x="170" y="590" width="250" height="180" class="box normal"/><text x="195" y="625" class="cap">POSITION MANAGER</text><text x="195" y="662" class="h">HOLD or CLOSE_*</text><text x="195" y="697" class="t">Package P&amp;L • Greeks • thesis</text><text x="195" y="725" class="t">Profit • loss • invalidation • time</text>
  <rect x="500" y="590" width="250" height="180" class="box live"/><text x="525" y="625" class="cap">ACTUAL REMAINING LEGS</text><text x="525" y="662" class="h">CLOSE REQUEST</text><text x="525" y="697" class="t">Reverse actual filled quantities</text><text x="525" y="725" class="t">Never parent requested quantity</text>
  <rect x="830" y="590" width="250" height="180" class="box live"/><text x="855" y="625" class="cap">BROKER COMPLEX ORDER</text><text x="855" y="662" class="h">CLOSING</text><text x="855" y="697" class="t">All remaining legs atomically</text><text x="855" y="725" class="t">Cancel/replace whole package only</text>
  <rect x="1160" y="590" width="250" height="180" class="box done"/><text x="1185" y="625" class="cap">FINAL RECONCILIATION</text><text x="1185" y="662" class="h">CLOSED</text><text x="1185" y="697" class="t">Zero verified remaining legs</text><text x="1185" y="725" class="t">Final fills and acknowledgement</text>
  <path d="M420 680H500" class="flow"/><path d="M750 680H830" class="flow"/><path d="M1080 680H1160" class="flow"/><path d="M1290 385V520H295V590" class="flow"/>

  <rect x="410" y="835" width="780" height="105" class="box bad"/><text x="440" y="872" class="cap">QUARANTINE — NO GUESSED OR PARTIAL ACTION</text><text x="440" y="906" class="h">Unknown group • missing leg • unequal partial • manual alteration • unsupported structure</text><text x="440" y="930" class="t">Stop the complete group, alert the operator, reconcile broker facts, and never create naked exposure.</text>
  <path d="M1010 385V825H930V835" class="dash"/><path d="M625 770V815H670V835" class="dash"/>

  <text x="55" y="965" class="sub">Restart behavior: reload durable groups → reconcile working orders and broker positions → resume only from verified state.</text>
</svg>
